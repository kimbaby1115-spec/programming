<!-- 7주차 기존 결과 화면 하단에 연결되는 새 기능 섹션 -->
<section id="challenge-section" class="section">
  <h2>📅 나만의 독서 챌린지 설정</h2>
  <p class="instruction">이 책을 언제까지 읽으실 건가요? 목표를 설정하면 하루 권장 독서량을 계산해 드립니다.</p>

  <form id="challenge-form" novalidate>
    <!-- 입력 및 레이블 안내 -->
    <div class="input-group">
      <label for="total-pages">총 페이지 수</label>
      <input type="number" id="total-pages" placeholder="예: 320" required>
    </div>

    <div class="input-group">
      <label for="target-days">목표 기간 (일)</label>
      <input type="number" id="target-days" placeholder="예: 7" required>
    </div>

    <!-- 다음 행동 버튼 -->
    <div class="button-group">
      <button type="button" id="btn-reset" class="btn btn-secondary">다시 설정</button>
      <button type="submit" id="btn-submit" class="btn btn-primary">챌린지 생성하기</button>
    </div>
  </form>

  <!-- 피드백 및 결과 피드백 영역 -->
  <div id="feedback-message" class="feedback hidden" role="alert"></div>
  
  <!-- 상태 변화가 반영되는 결과 화면 -->
  <div id="challenge-result" class="result-box hidden">
    <h3>🎉 챌린지가 생성되었습니다!</h3>
    <p class="result-summary">이 책을 <span id="res-days" class="highlight">0</span>일 동안 읽으려면,</p>
    <p class="result-action">하루에 최소 <span id="res-pages" class="highlight">0</span>페이지씩 읽어야 합니다!</p>
    <button type="button" id="btn-start" class="btn btn-success">독서 시작하기 (다음 행동)</button>
  </div>
</section>


</html>
