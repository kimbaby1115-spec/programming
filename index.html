<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookLog | 나만의 독서 기록 및 인사이트 관리</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 상단 헤더 및 내비게이션 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#record-section" class="logo" data-target="record-section">📚 BookLog</a>

      <!-- 모바일 메뉴 열기/닫기 버튼 -->
      <button
        type="button"
        id="mobile-menu-btn"
        class="mobile-menu-btn"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        메뉴 열기
      </button>

      <!-- 주요 메뉴 (nav > ul > li 구조) -->
      <nav id="primary-nav" class="primary-nav" aria-label="주요 메뉴">
        <ul class="nav-list">
          <li>
            <a href="#record-section" class="nav-link" data-target="record-section" aria-current="page">
              독서 기록 작성
            </a>
          </li>
          <li>
            <a href="#list-section" class="nav-link" data-target="list-section">
              내 서재 목록
            </a>
          </li>
          <li>
            <a href="#stats-section" class="nav-link" data-target="stats-section">
              독서 통계 요약
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- 1. 독서 기록 작성 영역 (기존 입력 및 저장 기능) -->
    <section id="record-section" class="page-section" tabindex="-1">
      <div class="section-header">
        <h2>독서 기록 작성</h2>
        <p class="section-desc">읽고 있는 책이나 완독한 책의 핵심 인사이트를 기록해 보세요.</p>
      </div>

      <form id="book-form" class="book-form">
        <div class="form-row">
          <div class="form-group">
            <label for="book-title">도서명 *</label>
            <input type="text" id="book-title" placeholder="예: 원씽, 사피엔스" required />
          </div>
          <div class="form-group">
            <label for="book-author">저자 *</label>
            <input type="text" id="book-author" placeholder="예: 게리 켈러" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="book-status">독서 상태</label>
            <select id="book-status">
              <option value="reading">읽는 중</option>
              <option value="completed">완독</option>
              <option value="wishlist">읽고 싶은 책</option>
            </select>
          </div>
          <div class="form-group">
            <label for="book-rating">평점 (1~5점)</label>
            <select id="book-rating">
              <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
              <option value="4">⭐⭐⭐⭐ (4점)</option>
              <option value="3">⭐⭐⭐ (3점)</option>
              <option value="2">⭐⭐ (2점)</option>
              <option value="1">⭐ (1점)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="book-memo">핵심 문장 및 메모 *</label>
          <textarea id="book-memo" rows="3" placeholder="기억에 남는 문장이나 느낀 점을 적어주세요." required></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">기록 저장하기</button>
          <button type="button" id="reset-sample-btn" class="btn-secondary">예시 데이터 불러오기</button>
        </div>
      </form>
    </section>

    <!-- 2. 내 서재 목록 및 필터 영역 -->
    <section id="list-section" class="page-section" tabindex="-1">
      <div class="section-header">
        <h2>내 서재 목록</h2>
        <p class="section-desc">독서 상태별로 기록을 모아보고 상세 내용을 확인할 수 있습니다.</p>
      </div>

      <!-- 필터 버튼 그룹 (4가지 필터 구성) -->
      <div class="filter-bar" role="group" aria-label="독서 상태 필터">
        <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="filter-btn" data-filter="reading" aria-pressed="false">읽는 중</button>
        <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">완독</button>
        <button type="button" class="filter-btn" data-filter="wishlist" aria-pressed="false">읽고 싶은 책</button>
      </div>

      <!-- 결과 개수 안내 및 전체 비우기 버튼 -->
      <div class="list-status-bar">
        <p id="result-count" class="result-count" aria-live="polite">총 0건의 기록이 표시됩니다.</p>
        <button type="button" id="clear-all-btn" class="btn-danger-text">전체 기록 비우기</button>
      </div>

      <!-- 빈 목록 안내 영역 (전체 없음 vs 조건 결과 없음 구분) -->
      <div id="empty-message" class="empty-box" hidden></div>

      <!-- 도서 카드 목록 -->
      <ul id="book-list" class="book-list"></ul>
    </section>

    <!-- 3. 독서 통계 요약 영역 -->
    <section id="stats-section" class="page-section" tabindex="-1">
      <div class="section-header">
        <h2>독서 통계 요약</h2>
        <p class="section-desc">현재 저장된 독서 기록을 바탕으로 집계한 현황입니다.</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">전체 기록</span>
          <strong id="stat-total" class="stat-value">0권</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">완독한 책</span>
          <strong id="stat-completed" class="stat-value">0권</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">읽는 중</span>
          <strong id="stat-reading" class="stat-value">0권</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">읽고 싶은 책</span>
          <strong id="stat-wishlist" class="stat-value">0권</strong>
        </div>
      </div>
    </section>
  </main>

  <!-- 상세 보기 모달 (기존 상세 보기 기능 유지) -->
  <dialog id="detail-modal" class="detail-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-badge" class="badge">상태</span>
        <button type="button" id="close-modal-btn" class="close-modal-btn" aria-label="상세 창 닫기">✕</button>
      </div>
      <h3 id="modal-title" class="modal-title">도서 제목</h3>
      <p id="modal-meta" class="modal-meta">저자 | 평점 | 작성일</p>
      <div class="modal-body">
        <p id="modal-memo"></p>
      </div>
      <div class="modal-footer">
        <button type="button" id="modal-delete-btn" class="btn-danger">이 기록 삭제</button>
        <button type="button" id="modal-confirm-btn" class="btn-primary">닫기</button>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
